[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "cmake>=3.15", "ninja"]
build-backend = "scikit_build_core.build"

[project]
name = "gpu-scheduler"
version = "0.1.0"
description = "Topology-aware GPU cluster scheduler simulator"
requires-python = ">=3.9"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "jinja2>=3.1",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pybind11>=2.12"]

[tool.scikit-build]
minimum-version = "0.10"
wheel.packages = []
cmake.build-type = "Release"

[tool.scikit-build.cmake.define]
CMAKE_EXPORT_COMPILE_COMMANDS = "ON"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
